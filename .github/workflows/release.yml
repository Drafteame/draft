name: Release

on:
  push:
    branches:
      - main

env:
  GIT_USER_EMAIL: ${{ secrets.GIT_EMAIL }}
  GIT_USER_NAME: ${{ secrets.GIT_NAME }}

permissions:
  contents: write

jobs:
  bump_version:
    if: "!startsWith(github.event.head_commit.message, 'bump:') && !startsWith(github.event.head_commit.message, 'ci:')"
    runs-on: ubuntu-22.04
    name: "Bump version"
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: "${{ secrets.ACCESS_TOKEN }}"
          ref: "main"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: Install sd
        run: |
          curl -L https://github.com/chmln/sd/releases/download/v1.0.0/sd-v1.0.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv sd-v1.0.0-x86_64-unknown-linux-gnu/sd /usr/local/bin/sd && sudo chmod +x /usr/local/bin/sd

      - name: Config Git User
        run: |
          git config --local user.email "$GIT_USER_EMAIL"
          git config --local user.name "$GIT_USER_NAME"
          git config --local pull.ff only

      - name: Install commitizen
        run: pip install -U commitizen

      - name: Get version
        id: version
        run: |
          version=$(cz bump --dry-run --no-verify | grep tag | sed 's/tag to create: v//')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Update vendor hash
        run: bash update-nix-hashes.sh "${{ steps.version.outputs.version }}"

      - name: Commit vendor hash update
        run: |
          git config --local user.email "${{ env.GIT_USER_EMAIL }}"
          git config --local user.name "${{ env.GIT_USER_NAME }}"
          git add flake.nix
          git commit -m "chore(ci): update vendor hash for version ${{ steps.version.outputs.version }}"

      - name: Create bump and changelog
        id: bump
        run: |
          cz bump --changelog --yes --no-verify
          export REV=`cz version --project`
          echo "version=$REV" >> $GITHUB_OUTPUT

      - name: Push changes
        uses: ad-m/github-push-action@v1.1.0
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ github.repository }}
          branch: 'main'
          directory: .
          tags: true

      - name: Print Version
        run: echo "Bumped to version ${{ steps.bump.outputs.version }}"

  release:
    runs-on: ubuntu-24.04
    name: "Release service"
    needs:
      - bump_version
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: "${{ secrets.ACCESS_TOKEN }}"
          ref: "main"

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION_FULL }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}

  upload_artifacts:
    name: Upload artifacts
    runs-on: ubuntu-24.04
    needs:
      - bump_version
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: main

      - name: Set Version File
        run: |
          echo '{"draftCliVersion": "${{ needs.bump_version.outputs.version }}"}' > version.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: '${{ secrets.AWS_ACCESS_KEY_ID_PROD }}'
          aws-secret-access-key: '${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}'
          aws-region: '${{ secrets.AWS_DEFAULT_REGION_PROD }}'

      - name: Upload artifacts to S3
        run: |
          aws s3 cp ./version.json s3://draftea-cdn-prod/xb/draft-cli/version.json